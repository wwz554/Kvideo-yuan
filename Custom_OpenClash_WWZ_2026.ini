; =========================================================
; Custom_OpenClash_WWZ_2026.ini
; OpenClash / SubConverter-Extended
; 设计目标：
; 1) 不依赖 GEOSITE / GEOIP / rule-provider 远程运行时下载
; 2) 让 Google / Gemini / OpenWrt / Telegram 等应用独立可选节点
; 3) 中国大陆常见域名/IP规则优先直连
; 4) 其余未命中的流量默认进入“漏网之鱼”，可手动选择节点
; =========================================================

[custom]

; ---------------------------------------------------------
; A. 局域网 / 本机地址：直连
; ---------------------------------------------------------
ruleset=🎯 国内直连,[]DOMAIN,localhost
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,local
ruleset=🎯 国内直连,[]IP-CIDR,10.0.0.0/8,no-resolve
ruleset=🎯 国内直连,[]IP-CIDR,172.16.0.0/12,no-resolve
ruleset=🎯 国内直连,[]IP-CIDR,192.168.0.0/16,no-resolve
ruleset=🎯 国内直连,[]IP-CIDR,100.64.0.0/10,no-resolve
ruleset=🎯 国内直连,[]IP-CIDR,127.0.0.0/8,no-resolve
ruleset=🎯 国内直连,[]IP-CIDR6,::1/128,no-resolve
ruleset=🎯 国内直连,[]IP-CIDR6,fc00::/7,no-resolve
ruleset=🎯 国内直连,[]IP-CIDR6,fe80::/10,no-resolve

; ---------------------------------------------------------
; B. Google 中国可直连域名：必须放在 Google 代理规则前
; ---------------------------------------------------------
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,google.cn
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,googleapis.cn
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,gstatic.cn

; ---------------------------------------------------------
; C. Gemini：单独分流
; 当前 Gemini 公共规则 + 已知缺失域名补充
; ---------------------------------------------------------
ruleset=🤖 Gemini,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list
ruleset=🤖 Gemini,[]DOMAIN,aistudio.google.com
ruleset=🤖 Gemini,[]DOMAIN,robinfrontend-pa.googleapis.com
ruleset=🤖 Gemini,[]DOMAIN-SUFFIX,geller-pa.googleapis.com
ruleset=🤖 Gemini,[]DOMAIN,alkalicore-pa.clients6.google.com

; ---------------------------------------------------------
; D. Google / Google FCM：单独分流
; ---------------------------------------------------------
ruleset=🇬 Google,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.list
ruleset=📢 Google FCM,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GoogleFCM/GoogleFCM.list

; ---------------------------------------------------------
; E. Telegram：单独分流
; ---------------------------------------------------------
ruleset=📲 Telegram,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list

; ---------------------------------------------------------
; F. OpenWrt：官方站点 / 下载 / 固件选择器 / 文档
; ---------------------------------------------------------
ruleset=🛠 OpenWrt,[]DOMAIN-SUFFIX,openwrt.org

; ---------------------------------------------------------
; G. AI / 开发 / 社交：按应用独立选择节点
; ---------------------------------------------------------
ruleset=🤖 ChatGPT,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=🧠 Claude,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list
ruleset=💻 Copilot,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Copilot/Copilot.list
ruleset=🚀 GitHub,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list
ruleset=🕊 Twitter(X),https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Twitter/Twitter.list
ruleset=📷 Instagram,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Instagram/Instagram.list
ruleset=🗣 Facebook,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Facebook/Facebook.list
ruleset=💬 WhatsApp,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Whatsapp/Whatsapp.list
ruleset=🎵 TikTok,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.list

; ---------------------------------------------------------
; H. 流媒体 / 音乐
; ---------------------------------------------------------
ruleset=📺 YouTube,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list
ruleset=🎬 Netflix,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.list
ruleset=📺 Disney+,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Disney/Disney.list
ruleset=🎞 HBO,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/HBO/HBO.list
ruleset=🎵 Spotify,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.list
ruleset=🎮 Steam,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Steam/Steam.list

; ---------------------------------------------------------
; I. 游戏
; ---------------------------------------------------------
ruleset=🎮 Epic,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Epic/Epic.list
ruleset=🎮 Nintendo,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Nintendo/Nintendo.list
ruleset=🎮 PlayStation,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Sony/Sony.list

; ---------------------------------------------------------
; J. 广义 GFW 规则：兜底代理国外常见站点
; ---------------------------------------------------------
ruleset=🚀 节点选择,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/gfw.txt

; ---------------------------------------------------------
; K. 中国大陆规则：尽量走直连
; 放在大多数国外应用规则之后，避免特定海外服务被误判为直连
; ---------------------------------------------------------
ruleset=🎯 国内直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China.list

; ---------------------------------------------------------
; L. 最终兜底
; 未匹配到的流量默认走“漏网之鱼”，可在 OpenClash 中选择节点
; ---------------------------------------------------------
ruleset=🐟 漏网之鱼,[]FINAL

; ---------------------------------------------------------
; 策略组：总入口
; ---------------------------------------------------------
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇹🇼 台湾`[]🇺🇸 美国`[]🇰🇷 韩国`[]🌍 其他地区`.*

custom_proxy_group=♻️ 自动选择`url-test`.*`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇭🇰 香港`url-test`(🇭🇰|港|HK|Hong ?Kong|Hongkong|HKG)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本`url-test`(🇯🇵|日|JP|Japan|东京|大阪|NRT|HND|KIX|TYO)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡`url-test`(🇸🇬|新加坡|SG|Singapore|SIN)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇹🇼 台湾`url-test`(🇹🇼|🇼🇸|台|TW|Taiwan|TPE)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国`url-test`(🇺🇸|美|US|USA|United States|America|LAX|SFO|SEA|IAD|JFK)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇰🇷 韩国`url-test`(🇰🇷|韩|KR|Korea|Seoul|首尔|ICN)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🌍 其他地区`url-test`.*`https://cp.cloudflare.com/generate_204`300,,50

